<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EventDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="auth-container">
    <div class="brand">
      <span class="brand-mark">ED</span> EventDesk
    </div>

    <div id="formAlert" class="alert d-none"></div>

    <!-- Login Box -->
    <div id="loginBox" class="auth-box">
      <h2>Login</h2>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="name@college.edu" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn">Login</button>
      </form>
      <div class="auth-links">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </div>
    </div>

    <!-- Welcome Box -->
    <div id="welcomeBox" class="auth-box d-none">
      <h2>Welcome Back!</h2>
      <div class="user-details">
        <p><strong>Name:</strong> <span id="userName"></span></p>
        <p><strong>Role:</strong> <span id="userRole"></span></p>
        <p><strong>Email:</strong> <span id="userEmail"></span></p>
        <p><strong>Department:</strong> <span id="userAddress"></span></p>
      </div>
      <a href="dashboard.html" class="btn" style="text-align: center; display: block; text-decoration: none; margin-bottom: 12px; line-height: 20px;">Go to Dashboard</a>
      <button id="logoutBtn" class="btn btn-danger">Logout</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
